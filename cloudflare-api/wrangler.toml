name = "planetkaworker01"
main = "src/index.js"
compatibility_date = "2026-03-15"
find_additional_modules = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.01

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[triggers]
crons = ["0 * * * *"]

[vars]
R2_PREFIX = "planetka-assets"
TILE_BROWSER_MAX_AGE_SECONDS = "86400"
TILE_EDGE_MAX_AGE_SECONDS = "604800"
TILE_CACHE_IMMUTABLE = "1"
ANALYTICS_ADMIN_EMAILS = "info@planetka.io,tom.griger@gmail.com"
LEGAL_VERSION = "2026-05-12"
TERMS_VERSION = "2026-05-12"
PRIVACY_VERSION = "2026-05-12"
MONTHLY_COST_ALERT_BASE_USD = "50"
MONTHLY_COST_ALERT_STEP_USD = "10"
R2_ESTIMATED_STORAGE_GB = "2600"
AUTH_REFRESH_HEALTH_WINDOW_SECONDS = "604800"
RATE_LIMIT_AUTH_EXCHANGE_IP_LIMIT = "30"
RATE_LIMIT_AUTH_EXCHANGE_IP_WINDOW_SECONDS = "60"
RATE_LIMIT_AUTH_REFRESH_IP_LIMIT = "60"
RATE_LIMIT_AUTH_REFRESH_IP_WINDOW_SECONDS = "60"
ADDON_UPDATE_VERSION = "0.7.7"
ADDON_UPDATE_DOWNLOAD_URL = "https://api.planetka.io/addon/releases/Planetka_update_0.7.7.zip"
ADDON_UPDATE_SHA256 = "779486c23ffa90f7e7f430bb3d485ceb10cc98da6626b6bae20194ed65c81298"
ADDON_UPDATE_PUBLISHED_AT = "2026-05-16T10:35:32Z"
ADDON_UPDATE_RELEASE_NOTES_URL = "https://www.planetka.io/blender/documentation/"
ADDON_UPDATE_CHANNEL = "stable"

[[d1_databases]]
binding = "DB"
database_name = "planetka-auth"
database_id = "8dd80102-88df-4105-9884-8e231875bc6d"

[[r2_buckets]]
binding = "PLANETKA_DATA"
bucket_name = "planetka-data"

[[queues.producers]]
binding = "TILE_EVENT_QUEUE"
queue = "planetka-tile-events"

[[queues.consumers]]
queue = "planetka-tile-events"
max_batch_size = 50
max_batch_timeout = 5
