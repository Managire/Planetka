name = "planetkaworker01"
main = "src/index.js"
compatibility_date = "2026-03-15"

[triggers]
crons = ["0 * * * *"]

[vars]
R2_PREFIX = "planetka-assets"
TILE_BROWSER_MAX_AGE_SECONDS = "86400"
TILE_EDGE_MAX_AGE_SECONDS = "604800"
TILE_CACHE_IMMUTABLE = "1"
ANALYTICS_ADMIN_EMAILS = "info@planetka.io,tom.griger@gmail.com"
DOWNLOAD_THROTTLED_REQUESTS_PER_MINUTE = "0"
DOWNLOAD_THROTTLED_DELAY_MS = "30000"
DOWNLOAD_THROTTLE_DURATION_MINUTES = "1440"
DOWNLOAD_THROTTLE_FREE_DAILY_GB = "0"
DOWNLOAD_THROTTLE_PRO_DAILY_GB = "0"
TRIAL_INCLUDED_GB = "25"
MONTHLY_COST_ALERT_BASE_USD = "50"
MONTHLY_COST_ALERT_STEP_USD = "10"
R2_ESTIMATED_STORAGE_GB = "2600"
ADDON_UPDATE_VERSION = "0.5.0"
ADDON_UPDATE_DOWNLOAD_URL = "https://pub-563b561afd7a4af4ad4c0ffe54b1e665.r2.dev/releases/Planetka_update_0.5.0.zip"
ADDON_UPDATE_SHA256 = ""
ADDON_UPDATE_PUBLISHED_AT = "2026-04-08T13:00:00Z"
ADDON_UPDATE_RELEASE_NOTES_URL = "https://www.planetka.io/blender/documentation/"
ADDON_UPDATE_CHANNEL = "stable"

[[d1_databases]]
binding = "DB"
database_name = "planetka-auth"
database_id = "8dd80102-88df-4105-9884-8e231875bc6d"

[[r2_buckets]]
binding = "PLANETKA_DATA"
bucket_name = "planetka-data"
