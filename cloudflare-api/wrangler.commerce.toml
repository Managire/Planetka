name = "planetka-commerce"
main = "src/retired_worker.js"
compatibility_date = "2026-03-15"
find_additional_modules = true
routes = [
  { pattern = "api.planetka.io/credits/*", zone_name = "planetka.io" },
  { pattern = "api.planetka.io/stripe/webhook", zone_name = "planetka.io" }
]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.01

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[vars]
R2_PREFIX = "planetka-assets"
TILE_BROWSER_MAX_AGE_SECONDS = "86400"
TILE_EDGE_MAX_AGE_SECONDS = "604800"
TILE_CACHE_IMMUTABLE = "1"
MONTHLY_COST_ALERT_BASE_USD = "50"
MONTHLY_COST_ALERT_STEP_USD = "10"
R2_ESTIMATED_STORAGE_GB = "2600"
AUTH_REFRESH_HEALTH_WINDOW_SECONDS = "604800"
RATE_LIMIT_AUTH_EXCHANGE_IP_LIMIT = "30"
RATE_LIMIT_AUTH_EXCHANGE_IP_WINDOW_SECONDS = "60"
RATE_LIMIT_AUTH_REFRESH_IP_LIMIT = "60"
RATE_LIMIT_AUTH_REFRESH_IP_WINDOW_SECONDS = "60"
PLANETKA_BETA_DEFAULT_PRO = "0"

[[d1_databases]]
binding = "DB"
database_name = "planetka-auth"
database_id = "8dd80102-88df-4105-9884-8e231875bc6d"

[[r2_buckets]]
binding = "PLANETKA_DATA"
bucket_name = "planetka-data"
