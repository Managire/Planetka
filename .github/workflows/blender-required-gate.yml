name: Blender Required Gate

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  required-gate:
    name: Required Gate (Ubuntu / Blender 5.1.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: blender-required-gate-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run release gate
        shell: bash
        run: |
          python3 tools/release_gate.py

      - name: Install Blender
        shell: bash
        run: |
          python .github/scripts/install_blender.py \
            --version "5.1.0" \
            --install-dir "${{ runner.temp }}/blender" \
            --output-file "${{ runner.temp }}/blender-bin.txt"

      - name: Run Blender test gate
        shell: bash
        run: |
          python .github/scripts/run_blender_tests.py \
            --blender-bin "$(cat "${RUNNER_TEMP}/blender-bin.txt")"

      - name: Run abuse simulation gate
        shell: bash
        run: |
          python3 tools/worker_abuse_simulation.py --base-url "https://api.planetka.io" --tile-requests 60

      - name: Validate authenticated abuse token is configured
        shell: bash
        env:
          PLANETKA_CI_BEARER_TOKEN: ${{ secrets.PLANETKA_CI_BEARER_TOKEN }}
        run: |
          if [ -z "${PLANETKA_CI_BEARER_TOKEN}" ]; then
            echo "::error::Missing required GitHub secret PLANETKA_CI_BEARER_TOKEN"
            exit 1
          fi

      - name: Run authenticated abuse simulation gate
        shell: bash
        env:
          PLANETKA_BEARER_TOKEN: ${{ secrets.PLANETKA_CI_BEARER_TOKEN }}
        run: |
          python3 tools/worker_abuse_simulation.py --base-url "https://api.planetka.io" --tile-requests 60 --analytics-minutes 60
