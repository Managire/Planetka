<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#050A0F"/>
  <text x="80" y="96" fill="#F3FDFF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Planetka logo concepts</text>
  <text x="80" y="132" fill="#89A6B5" font-family="Arial, Helvetica, sans-serif" font-size="22">Minimal planetary directions focused on tiles, resolve, and geospatial tooling.</text>

  <rect x="80" y="190" width="470" height="280" rx="32" fill="#0A121A" stroke="#1A2A35"/>
  <rect x="650" y="190" width="470" height="280" rx="32" fill="#0A121A" stroke="#1A2A35"/>
  <rect x="80" y="530" width="470" height="280" rx="32" fill="#0A121A" stroke="#1A2A35"/>
  <rect x="650" y="530" width="470" height="280" rx="32" fill="#0A121A" stroke="#1A2A35"/>

  <image href="planetka-logo-tiled-globe.svg" x="116" y="218" width="180" height="180"/>
  <text x="320" y="262" fill="#F3FDFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Tiled Globe</text>
  <text x="320" y="302" fill="#9AB4C0" font-family="Arial, Helvetica, sans-serif" font-size="20">Directly communicates globe + tile system.</text>
  <text x="320" y="334" fill="#9AB4C0" font-family="Arial, Helvetica, sans-serif" font-size="20">Best fit if Planetka stays descriptive.</text>

  <image href="planetka-logo-resolve-ring.svg" x="686" y="218" width="180" height="180"/>
  <text x="890" y="262" fill="#F3FDFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Resolve Ring</text>
  <text x="890" y="302" fill="#9AB4C0" font-family="Arial, Helvetica, sans-serif" font-size="20">Feels more like a product system.</text>
  <text x="890" y="334" fill="#9AB4C0" font-family="Arial, Helvetica, sans-serif" font-size="20">Good match for streamed data workflow.</text>

  <image href="planetka-logo-monogram-p.svg" x="116" y="558" width="180" height="180"/>
  <text x="320" y="602" fill="#F3FDFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Orbital P</text>
  <text x="320" y="642" fill="#9AB4C0" font-family="Arial, Helvetica, sans-serif" font-size="20">Most brandable long term.</text>
  <text x="320" y="674" fill="#9AB4C0" font-family="Arial, Helvetica, sans-serif" font-size="20">Less literal, more software-product feel.</text>

  <image href="planetka-logo-horizon-tile.svg" x="686" y="558" width="180" height="180"/>
  <text x="890" y="602" fill="#F3FDFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Horizon Tile</text>
  <text x="890" y="642" fill="#9AB4C0" font-family="Arial, Helvetica, sans-serif" font-size="20">Leans toward rendering and framing.</text>
  <text x="890" y="674" fill="#9AB4C0" font-family="Arial, Helvetica, sans-serif" font-size="20">Works well for tutorials and cinematic branding.</text>
</svg>
